<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
    Minimal fontconfig config for the headless CI tests (mgl text pipeline,
    Phase 10 milestone B).

    MSYS2's fontconfig has the package-builder's sysconfdir baked in
    (C:\msys64\etc\fonts), which does not exist on GitHub's runners — so
    FONTCONFIG_PATH is pointed at this directory (the workflow test steps
    set it) and fontconfig scans the Windows font directory directly, which
    is where every font on the runner lives (Arial, Segoe UI, ...).
-->
<fontconfig>
  <dir>C:/Windows/Fonts</dir>
</fontconfig>
